name: ee471-week7-fashion-baseline
services:
  baseline:
    image: ee471-week7-fashion-baseline:latest
    pull_policy: never
    ports:
      - "127.0.0.1:5072:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:5000/health-check',timeout=3); assert json.load(r)['status']=='READY'"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
  optimized:
    image: ee471-week7-fashion-optimized:latest
    pull_policy: never
    ports:
      - "127.0.0.1:5073:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:5000/health-check',timeout=3); assert json.load(r)['status']=='READY'"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
  website:
    image: ee471-week7-fashion-website:latest
    pull_policy: never
    build:
      context: ./website
    environment:
      BASELINE_URL: http://baseline:5000
      OPTIMIZED_URL: http://optimized:5000
    ports:
      - "127.0.0.1:5071:5000"
    depends_on:
      baseline:
        condition: service_healthy
      optimized:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz',timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 3
